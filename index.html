<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квиз: прогулки и ходьба</title>
<style>
  :root {
    --accent: #0F9D46;
    --accent-light: #22C55E;
    --bg: #F4F7F5;
    --text: #1A1E1B;
    --muted: #6B756E;
    --card-bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .progress {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .progress-seg {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #E3E8E5;
    overflow: hidden;
  }
  .progress-seg.filled { background: var(--accent); }
  h1 {
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button.option {
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid #E3E8E5;
    background: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button.option:hover { border-color: var(--accent-light); }
  button.option.selected {
    border-color: var(--accent);
    background: rgba(15,157,70,0.08);
    font-weight: 600;
  }
  input.email-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid #E3E8E5;
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  input.email-input:focus { border-color: var(--accent-light); }
  input.email-input.invalid { border-color: #E31212; }
  .error-text {
    color: #E31212;
    font-size: 13px;
    margin-top: 6px;
    min-height: 16px;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }
  .btn-back {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 8px;
  }
  .btn-back:disabled { visibility: hidden; }
  .btn-next {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-next:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .result {
    text-align: center;
  }
  .result .emoji { font-size: 48px; margin-bottom: 8px; }
  .result p { color: var(--muted); font-size: 15px; line-height: 1.5; }
  .result .summary {
    text-align: left;
    background: var(--bg);
    border-radius: 14px;
    padding: 16px;
    margin-top: 20px;
    font-size: 14px;
  }
  .result .summary div { padding: 4px 0; }
  .result .summary b { color: var(--text); }

  .intro { text-align: center; }
  .intro-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 0.2px;
  }
  .intro-illustration {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 22px;
    line-height: 0;
  }
  .intro-illustration svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .intro h1 { text-align: center; }
  .intro .subtitle { text-align: center; margin-bottom: 28px; }
  .btn-start {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-start:hover { opacity: 0.92; }
  .btn-start:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card" id="app"></div>

<script>
const LOGO_SVG = `
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="13" cy="4" r="2" fill="#0F9D46"/>
    <path d="M12 6L11 13M12 6L9 8M12 6L15 5M11 13L8 19M11 13L14 16L13 20" stroke="#0F9D46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
`;

const HERO_SVG = `
  <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="360" height="240" rx="0" fill="#EAF7EE"/>
    <circle cx="300" cy="55" r="26" fill="#FFD166"/>
    <g stroke="#FFD166" stroke-width="4" stroke-linecap="round">
      <line x1="300" y1="12" x2="300" y2="2"/>
      <line x1="333" y1="22" x2="340" y2="15"/>
      <line x1="343" y1="55" x2="353" y2="55"/>
      <line x1="333" y1="88" x2="340" y2="95"/>
    </g>
    <g fill="#FFFFFF" opacity="0.9">
      <ellipse cx="58" cy="48" rx="26" ry="14"/>
      <ellipse cx="80" cy="44" rx="18" ry="12"/>
      <ellipse cx="38" cy="44" rx="16" ry="10"/>
    </g>
    <path d="M0 190 Q90 150 180 185 T360 180 V240 H0 Z" fill="#CDEBD6"/>
    <path d="M0 212 Q120 178 240 206 T360 206 V240 H0 Z" fill="#B7E3C3"/>
    <path d="M30 206 Q120 166 190 191 T330 160" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
    <g>
      <rect x="46" y="165" width="6" height="20" rx="3" fill="#8A6E4B"/>
      <circle cx="49" cy="158" r="16" fill="#4FAE6B"/>
    </g>
    <g>
      <rect x="308" y="118" width="6" height="22" rx="3" fill="#8A6E4B"/>
      <circle cx="311" cy="110" r="18" fill="#3F9C5C"/>
    </g>
    <g fill="#0F9D46" opacity="0.5">
      <ellipse cx="95" cy="184" rx="4" ry="6" transform="rotate(-20 95 184)"/>
      <ellipse cx="112" cy="176" rx="4" ry="6" transform="rotate(-15 112 176)"/>
      <ellipse cx="228" cy="179" rx="4" ry="6" transform="rotate(10 228 179)"/>
      <ellipse cx="246" cy="170" rx="4" ry="6" transform="rotate(15 246 170)"/>
    </g>
    <g transform="translate(150,90)">
      <circle cx="26" cy="8" r="10" fill="#0F9D46"/>
      <path d="M26 18 L22 46" stroke="#0F9D46" stroke-width="7" stroke-linecap="round"/>
      <path d="M26 24 L12 34" stroke="#0F9D46" stroke-width="6" stroke-linecap="round"/>
      <path d="M26 24 L40 16" stroke="#0F9D46" stroke-width="6" stroke-linecap="round"/>
      <path d="M22 46 L10 72" stroke="#0F9D46" stroke-width="7" stroke-linecap="round"/>
      <path d="M22 46 L36 60 L34 76" stroke="#0F9D46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </svg>
`;

const QUESTIONS = [
  {
    key: "gender",
    type: "choice",
    title: "Укажи свой пол",
    options: ["Женский", "Мужской"]
  },
  {
    key: "age",
    type: "choice",
    title: "Сколько тебе лет?",
    options: ["18–29", "30–39", "40–49", "50+"]
  },
  {
    key: "activity",
    type: "choice",
    title: "Сколько сейчас в среднем шагов проходишь в день?",
    options: ["Меньше 3000", "3000–6000", "6000–10000", "Больше 10000"]
  },
  {
    key: "goal",
    type: "choice",
    title: "Какая твоя главная цель?",
    options: ["Снизить вес", "Повысить выносливость", "Снять стресс", "Выработать привычку двигаться"]
  },
  {
    key: "time",
    type: "choice",
    title: "Сколько времени готов уделять прогулкам в день?",
    options: ["15 минут", "30 минут", "45 минут", "60 минут и больше"]
  },
  {
    key: "email",
    type: "email",
    title: "На какую почту прислать план?",
    subtitle: "Отправим персональный план прогулок сразу после квиза"
  }
];

let screen = "intro"; // "intro" | "quiz"
let current = 0;
const answers = {};

function isValidEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
}

function renderIntro() {
  return `
    <div class="intro">
      <div class="intro-logo">
        ${LOGO_SVG}
        <span>WalkQuiz</span>
      </div>
      <div class="intro-illustration">${HERO_SVG}</div>
      <h1>Узнай свою норму шагов</h1>
      <div class="subtitle">5 вопросов — и план прогулок у тебя на почте</div>
      <button class="btn-start" id="startBtn">Начать тест</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");

  if (screen === "intro") {
    app.innerHTML = renderIntro();
    document.getElementById("startBtn").addEventListener("click", () => {
      screen = "quiz";
      render();
    });
    return;
  }

  if (current >= QUESTIONS.length) {
    app.innerHTML = renderResult();
    return;
  }

  const q = QUESTIONS[current];
  const selected = answers[q.key];

  const progressHtml = `
    <div class="progress">
      ${QUESTIONS.map((_, i) => `<div class="progress-seg ${i <= current ? 'filled' : ''}"></div>`).join("")}
    </div>
  `;

  const titleHtml = `
    <h1>${q.title}</h1>
    ${q.subtitle ? `<div class="subtitle">${q.subtitle}</div>` : ""}
  `;

  let bodyHtml = "";
  if (q.type === "choice") {
    bodyHtml = `
      <div class="options">
        ${q.options.map(opt => `
          <button class="option ${selected === opt ? 'selected' : ''}" data-value="${opt}">${opt}</button>
        `).join("")}
      </div>
    `;
  } else if (q.type === "email") {
    bodyHtml = `
      <input type="email" class="email-input" id="emailInput" placeholder="you@example.com" value="${selected || ''}" />
      <div class="error-text" id="emailError"></div>
    `;
  }

  const nextEnabled = q.type === "email" ? !!(selected && isValidEmail(selected)) : !!selected;

  app.innerHTML = `
    ${progressHtml}
    ${titleHtml}
    ${bodyHtml}
    <div class="nav">
      <button class="btn-back" id="backBtn">Назад</button>
      <button class="btn-next" id="nextBtn" ${nextEnabled ? '' : 'disabled'}>${q.type === 'email' ? 'Получить план' : 'Далее'}</button>
    </div>
  `;

  if (q.type === "choice") {
    document.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => {
        answers[q.key] = btn.dataset.value;
        render();
      });
    });
  } else if (q.type === "email") {
    const input = document.getElementById("emailInput");
    const nextBtn = document.getElementById("nextBtn");
    input.focus();
    input.addEventListener("input", () => {
      answers.email = input.value;
      const valid = isValidEmail(input.value);
      nextBtn.disabled = !valid;
      input.classList.toggle("invalid", input.value.length > 0 && !valid);
      document.getElementById("emailError").textContent =
        input.value.length > 0 && !valid ? "Проверь формат почты" : "";
    });
  }

  document.getElementById("backBtn").addEventListener("click", () => {
    if (current > 0) { current--; render(); }
    else { screen = "intro"; render(); }
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    const valid = q.type === "email" ? isValidEmail(answers.email || "") : !!answers[q.key];
    if (valid) { current++; render(); }
  });
}

function renderResult() {
  return `
    <div class="result">
      <div class="emoji">🚶</div>
      <h1>Готово!</h1>
      <p>Мы учли твои ответы и отправили бы план прогулок на <b>${answers.email || "-"}</b>.</p>
      <div class="summary">
        <div><b>Пол:</b> ${answers.gender || "-"}</div>
        <div><b>Возраст:</b> ${answers.age || "-"}</div>
        <div><b>Активность сейчас:</b> ${answers.activity || "-"}</div>
        <div><b>Цель:</b> ${answers.goal || "-"}</div>
        <div><b>Время на прогулки:</b> ${answers.time || "-"}</div>
        <div><b>Почта:</b> ${answers.email || "-"}</div>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
